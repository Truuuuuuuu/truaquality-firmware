; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7
	bertmelis/espMqttClient@^1.7.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	tzapu/WiFiManager@^2.0.17
; WiFiManager's captive portal (WebServer + DNSServer) adds ~100-150 KB; switch to the larger app partition if
; the build overflows the default one now that there's no OTA to make room for.
; board_build.partitions = huge_app.csv
