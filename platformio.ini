; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
; Only the on-device signing suite builds here. The native wire-format suite can't: it has no Arduino
; framework, and building it for this board would drag in mbedTLS and the whole ESP32 toolchain.
test_filter = test_signing
; ArduinoJson is pinned exactly, not left on a ^7 range, because [env:native] and [env:nodemcu-32s] must
; resolve the SAME ArduinoJson. A float-formatting change between two 7.x releases would make the two
; environments emit different bytes for the same reading, and the host suite would stop proving anything
; about what the board actually publishes.
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	bertmelis/espMqttClient@^1.7.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	tzapu/WiFiManager@^2.0.17
; WiFiManager's captive portal (WebServer + DNSServer) adds ~100-150 KB; switch to the larger app partition if
; the build overflows the default one now that there's no OTA to make room for.
; board_build.partitions = huge_app.csv

; Host build for the pure wire-format module. No Arduino, no mbedTLS, no hardware — so the bytes the unit
; would publish can be checked against the backend's golden fixture without a board on the desk.
;
; lib_ignore covers Uplink and Provisioning as belt-and-braces only: PlatformIO's default `chain` LDF
; already skips a library the test sources never #include, so those two don't break the host build on their
; own. They stay listed so a future stray Arduino include fails loudly here instead of confusingly.
;
; Sensors is a different case, and the pair below is NOT a contradiction — do not delete either half.
; WireFormat.h includes Sensors.h (wire::Stamped embeds SensorSample), so that header must be reachable on
; the host. But lib/Sensors/Sensors.cpp includes <Arduino.h>, <OneWire.h> and <DallasTemperature.h>. Leave
; Sensors out of lib_ignore and the `chain` LDF follows the header include, compiles the whole library, and
; the native build dies with "lib/Sensors/Sensors.cpp:3:10: fatal error: 'Arduino.h' file not found".
; Ignore Sensors without -Ilib/Sensors and it dies with "fatal error: 'Sensors.h' file not found", because
; lib_ignore strips a library's include path along with its sources. Ignoring the library while putting its
; directory on the include path gives the header without the sources; nothing in wire:: calls
; sensors::begin() or sensors::readAll(), so the uncompiled objects cause no link error.
; Sensors.h is kept Arduino-free on purpose (the rule is recorded in that header) — that is what makes this
; work. Sensors.cpp stays free to depend on Arduino because it is never compiled natively.
[env:native]
platform = native
test_framework = unity
; Every native suite must be listed here by name: a new test_*/ directory that isn't in this filter is
; silently skipped, so the suite looks green while running nothing.
test_filter = test_wireformat, test_turbidity_math
build_flags = -std=gnu++17 -Ilib/Sensors
lib_deps = bblanchon/ArduinoJson@7.4.3
lib_ignore = Uplink, Provisioning, Sensors

; Bench instrument only. This is [env:nodemcu-32s] plus -DTURBIDITY_BENCH=1, which compiles in the `cal show`
; / `cal capture` / `cal set <mV>` serial commands and the one-line-per-burst CSV log used to characterize the
; turbidity sensor. Both live inside `#if TURBIDITY_BENCH` blocks in src/main.cpp, so `pio run -e nodemcu-32s`
; cannot contain them (proved by comparing the two firmware.elf files for the marker string "turbidity-bench",
; not by reading the source).
;
; A unit flashed from HERE must never be installed at a pond: the serial console lets anyone with a USB cable
; rewrite that unit's clear-water calibration, which silently changes every NTU it reports afterwards. Reflash
; a bench unit from [env:nodemcu-32s] before it goes in the water.
;
; Deliberately no build flag defining the report interval here. include/unit_config.h defines that macro
; unconditionally, so a -D flag for it would either collide with that definition or be silently overridden
; depending on include order - and either way it would change the real uplink cadence and publish bench noise
; to the live broker at 1 Hz. The bench log runs on its own BENCH_SAMPLE_INTERVAL_MS inside the guard instead,
; leaving the uplink cadence alone.
[env:nodemcu-32s-bench]
extends = env:nodemcu-32s
build_flags = -DTURBIDITY_BENCH=1
; Repeated rather than inherited: a test_filter that silently came back empty would run the whole native
; suite on the board.
test_filter = test_signing
